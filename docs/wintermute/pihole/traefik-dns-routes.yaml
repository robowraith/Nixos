apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteUDP
metadata:
  annotations: {}
  name: pihole-dns-udp-ingress
  namespace: pihole
spec:
  entryPoints:
    - dns-udp
  routes:
    - services:
        - name: pihole-dns-udp
          port: 53
          weight: 10
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteUDP
metadata:
  annotations: {}
  name: pihole-dhcp-udp-ingress
  namespace: pihole
spec:
  entryPoints:
    - dhcp4
  routes:
    - services:
        - name: pihole-dhcp4
          port: 67
          weight: 10
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  annotations: {}
  name: pihole-dns-tcp-ingress
  namespace: pihole
spec:
  entryPoints:
    - dns-tcp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: pihole-dns-tcp
          port: 53
          weight: 10
